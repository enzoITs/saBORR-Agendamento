<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Barbearia - AppBarber</title>
    <style>
        :root {
            --blue-primary: #2563EB;
            --gray-dark: #1F2937;
            --gray-medium: #9CA3AF;
            --gray-light: #F3F4F6;
            --white: #FFFFFF;
            --blue-hover: #1D4ED8;
            --red-error: #EF4444;
            --green-success: #10B981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--gray-light);
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 30px 20px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: var(--blue-primary);
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .progress-container {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .progress-line {
            height: 4px;
            background: #e5e7eb;
            position: relative;
            border-radius: 5px;
        }

        .progress-fill {
            height: 4px;
            background: var(--blue-primary);
            width: 0%;
            transition: 0.3s;
            border-radius: 5px;
        }

        .form-card {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
        }

        input:focus {
            border-color: var(--blue-primary);
            outline: none;
        }

        .error {
            border-color: var(--red-error);
        }

        .form-actions {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--blue-primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--blue-hover);
        }

        .success {
            text-align: center;
            display: none;
        }

        .success.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">✂️ AppBarber</div>
    <h1>Cadastre sua Barbearia</h1>

    <div class="progress-container">
        <div class="progress-line">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="form-card">
        <form id="form">
            <!-- ETAPA 1 -->
            <div class="form-section active" data-step="1">
                <h2>Dados da Barbearia</h2>
                <div class="form-group">
                    <label for="cnpj">CNPJ <span class="required">*</span></label>
                    <input type="text" id="cnpj" required>
                </div>
                <div class="form-group">
                    <label for="nomeBarbearia">Nome da Barbearia <span class="required">*</span></label>
                    <input type="text" id="nomeBarbearia" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="nextStep()">Próximo</button>
                </div>
            </div>

            <!-- ETAPA 2 -->
            <div class="form-section" data-step="2">
                <h2>Equipe</h2>
                <div class="form-group">
                    <label for="quantidadeBarbeiros">Quantidade de Barbeiros <span class="required">*</span></label>
                    <input type="number" id="quantidadeBarbeiros" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="prevStep()">Voltar</button>
                    <button type="button" class="btn btn-primary" onclick="nextStep()">Próximo</button>
                </div>
            </div>

            <!-- ETAPA 3 -->
            <div class="form-section" data-step="3">
                <h2>Serviços</h2>
                <div class="form-group">
                    <label for="nomeServico">Nome do Serviço <span class="required">*</span></label>
                    <input type="text" id="nomeServico" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="prevStep()">Voltar</button>
                    <button type="button" class="btn btn-primary" onclick="nextStep()">Próximo</button>
                </div>
            </div>

            <!-- ETAPA 4 -->
            <div class="form-section" data-step="4">
                <h2>Conta</h2>
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha <span class="required">*</span></label>
                    <input type="password" id="senha" required>
                </div>
                <div class="form-group">
                    <label for="confirmar">Confirmar Senha <span class="required">*</span></label>
                    <input type="password" id="confirmar" required>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="prevStep()">Voltar</button>
                    <button type="submit" class="btn btn-primary">Finalizar</button>
                </div>
            </div>
        </form>

        <div class="success" id="success">
            <h2>Cadastro realizado com sucesso!</h2>
        </div>
    </div>
</div>

<script>
    let currentStep = 1;
    const totalSteps = 4;

    function updateProgress() {
        let percent = ((currentStep - 1) / (totalSteps - 1)) * 100;
        document.getElementById("progressFill").style.width = percent + "%";
    }

    function showStep(step) {
        document.querySelectorAll(".form-section").forEach(s => s.classList.remove("active"));
        document.querySelector(`[data-step="${step}"]`).classList.add("active");
        updateProgress();
    }

    function validateStep() {
        let section = document.querySelector(`[data-step="${currentStep}"]`);
        let inputs = section.querySelectorAll("input[required]");
        let valid = true;

        inputs.forEach(input => {
            if (!input.value.trim()) {
                input.classList.add("error");
                valid = false;
            } else {
                input.classList.remove("error");
            }
        });

        if (currentStep === totalSteps) {
            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;
            if (senha !== confirmar) {
                alert("As senhas não coincidem");
                valid = false;
            }
        }

        return valid;
    }

    function nextStep() {
        if (validateStep()) {
            if (currentStep < totalSteps) {
                currentStep++;
                showStep(currentStep);
            }
        }
    }

    function prevStep() {
        if (currentStep > 1) {
            currentStep--;
            showStep(currentStep);
        }
    }

    document.getElementById("form").addEventListener("submit", function (e) {
        e.preventDefault();
        if (validateStep()) {
            document.querySelector(".form-card").style.display = "none";
            document.getElementById("success").classList.add("show");
        }
    });

    updateProgress();
</script>

</body>
</html>
